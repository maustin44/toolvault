name: CI/CD Pipeline

on:
  push:
    branches: [ "development", "ialbaki" ]

jobs:

# -------------------------
# 1. BUILD FRONTEND
# -------------------------
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Install Dependencies & Build
        run: |
          cd app/frontend
          npm install
          npm run build

# -------------------------
# 2. SECURITY SCANS
# -------------------------
  security:
    runs-on: ubuntu-latest
    needs: build

    steps:
      - uses: actions/checkout@v3

      # NPM Audit — saves results as JSON
      - name: NPM Audit
        run: |
          cd app/frontend
          npm install
          npm audit --json > ../../scan-results/npm-audit.json || true

      # Create scan-results folder
      - name: Create results folder
        run: mkdir -p scan-results

      # Move npm audit results
      - name: Move npm audit results
        run: |
          mkdir -p scan-results
          cd app/frontend
          npm audit --json > ../../scan-results/npm-audit.json || true

      # Setup Python (for tools)
      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.x'

      # Semgrep (code scan) — saves results as JSON
      - name: Run Semgrep
        run: |
          pip install semgrep
          semgrep scan --config auto --json > scan-results/semgrep.json || true

      # GitLeaks (secrets scan) — saves results as JSON
      - name: Run GitLeaks
        run: |
          docker run --rm -v $(pwd):/repo zricethezav/gitleaks detect \
            --source=/repo \
            --report-format json \
            --report-path /repo/scan-results/gitleaks.json || true

      # Trivy (dependency scan) — saves results as JSON
      - name: Install & Run Trivy
        run: |
          curl -sfL https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/install.sh | sudo sh
          trivy fs . --format json --output scan-results/trivy.json || true

      # Checkov (Terraform scan) — saves results as JSON
      - name: Run Checkov
        run: |
          pip install checkov
          checkov -d . --output json > scan-results/checkov.json || true

      # Upload all scan results as a single artifact
      - name: Upload Scan Results
        uses: actions/upload-artifact@v4
        with:
          name: security-scan-results
          path: scan-results/

# -------------------------
# 3. DEPLOY
# -------------------------
  deploy:
    runs-on: ubuntu-latest
    needs: security

    steps:
      - name: Deploy to EC2 via SSH
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            cd ~
            if [ ! -d "repo" ]; then
              git clone https://github.com/malinadettore/capstone-group3.git repo
            fi
            cd repo
            git pull
            cd app/frontend
            npm install
            npm run build
            sudo systemctl restart nginx

# -------------------------
# 4. OWASP ZAP
# -------------------------
  zap_scan:
    runs-on: ubuntu-latest
    needs: deploy

    steps:
      - name: Run OWASP ZAP Scan
        run: |
          mkdir -p zap-results
          docker run -t -v $(pwd)/zap-results:/zap/wrk owasp/zap2docker-stable zap-baseline.py \
            -t https://testphp.vulnweb.com \
            -r zap-report.html \
            -J zap-report.json || true

      - name: Upload ZAP Report
        uses: actions/upload-artifact@v4
        with:
          name: zap-scan-results
          path: zap-results/
